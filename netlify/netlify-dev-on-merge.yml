name: CI

trigger:
  branches:
    include:
      - main

variables:
  - group: 'Maps-Apps-Pipeline-Secrets'

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: Build
    jobs:
      - job: Determine_Affected
        displayName: 'Determine Affected Apps'
        steps:
          - script: |
              cd $(Build.SourcesDirectory)
              echo "the params are build_id: $(Build.BuildId), source_version: $(Build.SourceVersion), tag: dev-$(Build.BuildId)"
            displayName: 'Echo Parameters'

          - checkout: self
            clean: true
            persistCredentials: true
            fetchDepth: 10
            displayName: Check out source code from main repository

          - script: |
              git fetch origin main:refs/remotes/origin/main
            displayName: Fetch the latest history for main branch

          - template: steps/install-node.yml

          - script: npm ci
            displayName: 'Install Dependencies'

          - script: |
              cd $(Build.SourcesDirectory)

              # Fetch the base (previous) commit on main
              git fetch origin main --prune --unshallow
              BASE_COMMIT=$(git rev-parse origin/main~1)
              HEAD_COMMIT=$(git rev-parse origin/main)

              echo "Base commit: $BASE_COMMIT"
              echo "Head commit: $HEAD_COMMIT"

              # e2e projects are graph type "e2e", not "app": a test-only change affects
              # only the e2e project, so include those to keep e2e jobs running on spec merges.
              # jq -R + fromjson? extracts the JSON array even when nx writes non-JSON noise
              # to stdout on a cold start; pipefail still surfaces real nx failures
              set -o pipefail
              export NX_DAEMON=false
              echo "Running npx nx show projects --affected for apps and e2e projects"
              affected_apps=$(npx nx show projects --affected --type app --base=$BASE_COMMIT --head=$HEAD_COMMIT --json | jq -R -r 'fromjson? | .[]?')
              affected_e2e=$(npx nx show projects --affected --type e2e --base=$BASE_COMMIT --head=$HEAD_COMMIT --json | jq -R -r 'fromjson? | .[]?')
              affected=$(printf '%s\n%s\n' "$affected_apps" "$affected_e2e" | sed '/^$/d')

              echo "Affected Projects: $affected"

              if [ -z "$affected" ]; then
                echo "No affected projects. Exiting step."
                stepoutput=""
                echo "##vso[task.setvariable variable=envstodeploy;isOutput=true]$stepoutput"
                exit 0
              fi

              echo "Formatting output of affected projects..."
              stepoutput=$(echo "$affected" | tr '\n' ',')
              stepoutput=${stepoutput%,}

              echo "Setting envstodeploy variable..."
              echo "##vso[task.setvariable variable=envstodeploy;isOutput=true]$stepoutput"
              echo "envstodeploy is set to: $stepoutput"
            displayName: 'Determine Affected Projects'
            name: determinenxaffected

  - stage: Test
    dependsOn: [Build]
    variables:
      - name: envstodeploy
        value: stageDependencies.Build.Determine_Affected.outputs['determinenxaffected.envstodeploy']

    jobs:
      - job: Analyse_code
        displayName: 'Analyse Code'
        steps:
          - template: steps/analyze-code.yml
            parameters:
              SONARCLOUD_NAME: 'MAPS-SonarCloud'
              SONARCLOUD_ORGANISATION: $(organisationkey)
              SONARCLOUD_PROJECTKEY: $(projectKey)
              SONARCLOUD_PROJECTNAME: 'maps-apps'
              compareWithTargetBranch: true
              keyvaultname: MapsAppsDev
              AKS_SPN_ID: $(AKS_SPN_ID)
              AKS_SPN_KEY: $(aks-spn-key)
              TENANT_ID: $(TENANT_ID)

      - template: templates/test-affected.yml
        parameters:
          compareWithTargetBranch: false
          envstodeploy: ${{ variables.envstodeploy }}
          context: deploy-preview
          environment: develop

  - stage: ResetDevelopToMain
    dependsOn: [Build, Test]
    displayName: 'Resetting'
    jobs:
      - job: reset_develop_to_main
        displayName: 'Resetting develop to main'
        steps:
          - checkout: self
            displayName: Check out source code from main repository
            fetchDepth: 0
            persistCredentials: true

          - script: |
              git fetch
            displayName: Fetch

          - script: |
              git checkout main && git pull origin main
            displayName: Get latest from main

          - script: |
              git checkout develop && git pull origin develop
              git reset --hard main
            displayName: Resetting develop to main

          - script: |
              git push origin develop --force-with-lease
            displayName: Pushing develop

  - stage: Storybook
    displayName: Deploy Storybook
    dependsOn: [Build, Test]
    condition: succeeded()
    jobs:
      - job: Storybook_Deploy
        displayName: Install packages and publishes to Chromatic
        variables:
          npm_config_cache: $(Pipeline.Workspace)/.npm
        steps:
          - checkout: self
            displayName: Get full Git history
            fetchDepth: 0
          - template: steps/install-node.yml
          - task: Cache@2
            displayName: Install and cache packages
            inputs:
              key: npm | "$(Agent.OS)" | package-lock.json
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)
          - script: npm ci
            condition: "ne(variables.CACHE_RESTORED, 'true')"
          - task: CmdLine@2
            displayName: Publish to Chromatic
            inputs:
              script: npx chromatic
            env:
              CHROMATIC_PROJECT_TOKEN: $(chromatic-project-token)

  - stage: AuditWorkItems
    displayName: Audit Work Items
    jobs:
      - job: Tag_Work_Items
        displayName: Tag work items
        steps:
          - script: |
              git fetch --all
              git diff $(Build.SourceVersion)^ $(Build.SourceVersion) > git-diff.txt

              python3 netlify/scripts/tag-work-items.py
              exit_code=$?

              if [ $exit_code -ne 0 ]; then
                echo "##vso[task.logissue type=warning]Tag work items script failed, but we've ignored it."
              fi

              exit 0
            env:
              SYSTEM_ACCESS_TOKEN: $(System.AccessToken)
              SOURCE_VERSION: $(Build.SourceVersion)
              SYSTEM_COLLECTION_URI: $(System.CollectionUri)
              SYSTEM_TEAM_PROJECT: $(System.TeamProject)
              BUILD_REPOSITORY_ID: $(Build.Repository.ID)

            displayName: Automatically tag work items with Dev or QA automation.
