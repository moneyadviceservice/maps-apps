trigger: none

pool:
  vmImage: 'ubuntu-22.04'

parameters:
  - name: projectName
    displayName: Playwright target project
    type: string
    values:
      - adjustable-income-calculator
      - baby-cost-calculator
      - baby-money-timeline
      - budget-planner
      - cash-in-chunks
      - compare-accounts
      - credit-options
      - credit-rejection
      - debt-advice-locator
      - evidence-hub
      - fuel-finder
      - guaranteed-income-estimator
      - learning-pathway
      - leave-pot-untouched
      - midlife-mot
      - money-adviser-network # Currently blocked due to use of server side mocks.
      - moneyhelper-booking-forms # Currently blocked due to use of server side mocks.
      - moneyhelper-contact-forms # Currently blocked due to use of server side mocks.
      - mortgage-calculator
      - pension-calculator
      - pension-type-tool
      - pensions-dashboard # This currently has a dedicated pipeline, once this work has been completed, we will move over to using this one.
      - pensionwise-appointment
      - pensionwise-triage
      - redundancy-pay-calculator
      - retirement-budget-planner
      - retirement-guidance
      - salary-calculator
      - savings-calculator
      - stamp-duty-calculator
      - standard-financial-statement
      - take-whole-pot
      - travel-insurance-directory # Currently blocked due to use of basic auth.
      - workplace-pension-calculator

variables:
  - group: Maps-Apps-Pipeline-Secrets
  - group: mhpdE2eTest-test

stages:
  - stage: Test_Cross_Browser
    displayName: '${{ parameters.projectName }} Cross Browser Tests'
    jobs:
      - ${{ if eq(parameters.projectName, 'adjustable-income-calculator') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: adjustable-income-calculator
              baseUrl: https://develop--adjustable-income-calculator.netlify.app/

      - ${{ if eq(parameters.projectName, 'baby-cost-calculator') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: baby-cost-calculator
              baseUrl: https://develop--baby-cost-calculator.netlify.app/

      - ${{ if eq(parameters.projectName, 'baby-money-timeline') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: baby-money-timeline
              baseUrl: https://develop--maps-baby-money-timeline.netlify.app/

      - ${{ if eq(parameters.projectName, 'budget-planner') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: budget-planner
              baseUrl: https://develop--mh-budget-planner.netlify.app/

      - ${{ if eq(parameters.projectName, 'cash-in-chunks') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: cash-in-chunks
              baseUrl: https://develop--cash-in-chunks.netlify.app/

      - ${{ if eq(parameters.projectName, 'compare-accounts') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: compare-accounts
              baseUrl: https://develop--mh-compare-accounts.netlify.app/

      - ${{ if eq(parameters.projectName, 'credit-options') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: credit-options
              baseUrl: https://develop--credit-options.netlify.app/

      - ${{ if eq(parameters.projectName, 'credit-rejection') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: credit-rejection
              baseUrl: https://develop--credit-rejection.netlify.app/

      - ${{ if eq(parameters.projectName, 'debt-advice-locator') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: debt-advice-locator
              baseUrl: https://develop--debt-advice-locator.netlify.app/

      - ${{ if eq(parameters.projectName, 'evidence-hub') }}:
          - template: templates/test-cross-compatibility.yml
            parameters:
              projectName: evidence-hub
              baseUrl: https://develop--evidence-hub.netlify.app/

      - ${{ if eq(parameters.projectName, 'fuel-finder') }}:
