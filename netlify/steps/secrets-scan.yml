steps:
  - script: |
      set -euo pipefail
      PROJECT_ENCODED=$(printf '%s' "$PROJECT" | jq -sRr @uri)
      uri="${ORG_URL}${PROJECT_ENCODED}/_apis/build/builds/$(Build.BuildId)/changes?api-version=7.1"
      ChangesCount=$(curl --fail --silent --show-error --location \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" "$uri" | jq -er '.count')
      if [ "$(Build.Reason)" == "PullRequest" ]; then ChangesCount=$((ChangesCount+1)); fi
      echo "##vso[task.setvariable variable=ChangesCount]$ChangesCount"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      ORG_URL: $(System.TeamFoundationCollectionUri)
      PROJECT: $(System.TeamProject)
    displayName: 'Count commits for fetchDepth'

  - checkout: self
    fetchDepth: $(ChangesCount)
    displayName: 'Git Checkout'

  - script: |
      set -euo pipefail
      SCAN_EXIT_CODE=0
      docker run --rm -v "$(pwd)":/tmp ghcr.io/trufflesecurity/trufflehog:latest \
        --results=verified --fail --no-update --sarif git file:///tmp/ \
        > trufflehog.sarif || SCAN_EXIT_CODE=$?

      # Exit 183 means findings; defer failure until the summary and PR comment are created.
      if [ "$SCAN_EXIT_CODE" -ne 0 ] && [ "$SCAN_EXIT_CODE" -ne 183 ]; then
        echo "##vso[task.logissue type=error]TruffleHog scan failed (exit code $SCAN_EXIT_CODE)."
        exit "$SCAN_EXIT_CODE"
      fi

      if ! jq -e '.runs[0].results | type == "array"' trufflehog.sarif > /dev/null; then
        echo "##vso[task.logissue type=error]TruffleHog did not produce a valid SARIF report."
        exit 1
      fi

      COUNT=$(jq '.runs[0].results | length' trufflehog.sarif)
      if [ "$SCAN_EXIT_CODE" -eq 183 ] && [ "$COUNT" -eq 0 ]; then
        echo "##vso[task.logissue type=error]TruffleHog reported findings but the SARIF report is empty."
        exit 1
      fi
    displayName: 'Running TruffleHog (Open-Source)'

  - script: |
      set -euo pipefail
      echo "Summarizing TruffleHog SARIF..."
      COUNT=$(jq -er '.runs[0].results | length' trufflehog.sarif)
      echo "##vso[task.setvariable variable=TruffleHogSecretCount]$COUNT"

      if [ "$COUNT" -gt 0 ]; then
        echo "❌ Secrets detected: $COUNT"

        {
          echo "## 🔐 TruffleHog Secret Scan Results"
          echo "**$COUNT verified, active credential(s) detected.**"
          echo ""
          jq -r '
            .runs[0].results[:10][] |
            "- **Detector:** " + .ruleId + "\n  **File:** " + (.locations[0].physicalLocation.artifactLocation.uri)
          ' trufflehog.sarif
          echo ""
          echo "> Showing up to 10 findings. Full results available in trufflehog.sarif in the CodeAnalysisLogs artifact."
        } > summary.md

      else
        echo "✅ No secrets detected."
        echo "✅ No verified, active credentials detected by TruffleHog." > summary.md
      fi
    displayName: 'Create TruffleHog Summary'

  - script: |
      set -euo pipefail
      COUNT=$(jq -er '.runs[0].results | length' trufflehog.sarif)

      if [ "$COUNT" -eq 0 ]; then
        echo "No secrets detected - skipping PR comment"
        exit 0
      fi

      echo "Posting comment to PR thread for $COUNT secret(s)..."

      BODY=$(jq -n --rawfile content summary.md '{
        comments: [{parentCommentId: 0, content: $content, commentType: "text"}],
        status: "active"
      }')

      PROJECT_ENCODED=$(printf '%s' "$PROJECT" | jq -sRr @uri)

      URL="${ORG_URL}${PROJECT_ENCODED}/_apis/git/repositories/${REPO_ID}/pullRequests/${PR_ID}/threads?api-version=7.1"

      echo "Posting to URL: $URL"

      curl --fail -X POST \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        -H "Content-Type: application/json" \
        --data "$BODY" \
        "$URL"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      ORG_URL: $(System.TeamFoundationCollectionUri)
      PROJECT: $(System.TeamProject)
      REPO_ID: $(Build.Repository.ID)
      PR_ID: $(System.PullRequest.PullRequestId)
    displayName: 'Post TruffleHog Summary Comment to PR'
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))

  - script: |
      echo "##vso[task.logissue type=error]❌ TruffleHog detected $(TruffleHogSecretCount) verified, active credential(s)."
      exit 1
    displayName: 'Fail Pipeline If TruffleHog Secrets Found'
    condition: and(succeededOrFailed(), ne(variables['TruffleHogSecretCount'], ''), gt(variables['TruffleHogSecretCount'], 0))

  - task: PublishBuildArtifacts@1
    displayName: 'Publish TruffleHog SARIF'
    condition: always()
    inputs:
      pathToPublish: 'trufflehog.sarif'
      artifactName: 'CodeAnalysisLogs'
