[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/retirement-guidance package.json libs/shared"
  command = "npx nx run retirement-guidance:build && npx tsx apps/retirement-guidance/netlify/generate-headers.ts"

[[context.production.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[context.deploy-preview.plugins]]
    package = "/netlify/tools/plugins/stop-build"
 
[[context.develop.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[plugins]]
    package = "@netlify/plugin-csp-nonce"
    [plugins.inputs]
        reportOnly = false

[dev]
    base = "/"
    command = "npx nx run retirement-guidance:serve"
    targetPort = 4302
    autoLaunch = false

