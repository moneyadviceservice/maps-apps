[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/mhpd-test-harness package.json libs/shared"

[[context.production.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[context.deploy-preview.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[context.develop.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[plugins]]
    package = "@netlify/plugin-csp-nonce"
    [plugins.inputs]
        reportOnly = false

[dev]
    base = "/"
    command = "npx nx run mhpd-test-harness:serve"
    targetPort = 4304
    autoLaunch = false
