[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/learning-pathway package.json libs/shared"

[[context.production.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[context.deploy-preview.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[[context.develop.plugins]]
    package = "/netlify/tools/plugins/stop-build"

[dev]
    targetPort = 4314
    autoLaunch = false
    base = "/"
    command = "npx nx run learning-pathway:serve"

[[plugins]]
    package = "@netlify/plugin-csp-nonce"
    [plugins.inputs]
        reportOnly = false
